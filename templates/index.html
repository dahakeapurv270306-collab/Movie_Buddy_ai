<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --stage: #17161c;
    --curtain: #201f27;
    --panel: #26252f;
    --gold: #e3b155;
    --gold-dim: #7a6338;
    --velvet: #8c3244;
    --ink: #f1ede4;
    --ink-dim: #a9a4b3;
    --line: #3a3844;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--stage);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(227,177,85,0.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(140,50,68,0.08), transparent 45%);
  }

  .house {
    width: 100%;
    max-width: 620px;
    display: flex;
    flex-direction: column;
    height: min(760px, 92vh);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
    border: 1px solid var(--line);
  }

  /* Marquee header */
  .marquee {
    position: relative;
    background: var(--curtain);
    padding: 22px 28px 20px;
    border-bottom: 2px solid var(--gold-dim);
  }

  .marquee::before, .marquee::after {
    content: "";
    position: absolute;
    left: 18px; right: 18px;
    height: 1px;
    background-image: radial-gradient(circle, var(--gold) 1.5px, transparent 1.6px);
    background-size: 16px 1px;
    background-repeat: repeat-x;
    opacity: 0.85;
  }
  .marquee::before { top: 8px; }
  .marquee::after { bottom: 8px; }

  .marquee h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.9rem;
    letter-spacing: 0.01em;
    margin: 0;
    color: var(--gold);
  }

  .marquee p {
    margin: 4px 0 0;
    font-size: 0.88rem;
    color: var(--ink-dim);
  }

  .marquee form.reset {
    position: absolute;
    top: 24px;
    right: 26px;
  }

  .reset button {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-family: 'Work Sans', sans-serif;
    font-size: 0.78rem;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .reset button:hover {
    border-color: var(--gold-dim);
    color: var(--gold);
  }

  /* Film-strip framed chat reel */
  .reel {
    flex: 1;
    display: flex;
    background: var(--stage);
    overflow: hidden;
  }

  .sprockets {
    width: 20px;
    flex-shrink: 0;
    background: var(--curtain);
    background-image: radial-gradient(circle, var(--stage) 4px, transparent 4.2px);
    background-size: 20px 26px;
    background-position: center;
  }

  .frames {
    flex: 1;
    overflow-y: auto;
    padding: 22px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .frames::-webkit-scrollbar { width: 8px; }
  .frames::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .frames::-webkit-scrollbar-track { background: transparent; }

  .msg {
    display: flex;
    max-width: 82%;
  }
  .msg.bot { align-self: flex-start; }
  .msg.user { align-self: flex-end; }

  .bubble {
    padding: 12px 16px;
    border-radius: 4px;
    line-height: 1.5;
    font-size: 0.94rem;
    white-space: pre-line;
  }

  .msg.bot .bubble {
    background: var(--panel);
    border-left: 3px solid var(--gold);
    color: var(--ink);
    border-radius: 3px 10px 10px 3px;
  }

  .msg.user .bubble {
    background: var(--velvet);
    color: var(--ink);
    border-radius: 10px 3px 3px 10px;
  }

  /* Ticket-counter input bar */
  .counter {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    background: var(--curtain);
    border-top: 1px solid var(--line);
  }

  .counter input[type="text"] {
    flex: 1;
    background: var(--stage);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    font-size: 0.94rem;
  }

  .counter input[type="text"]:focus {
    outline: none;
    border-color: var(--gold-dim);
  }

  .counter input[type="text"]::placeholder {
    color: var(--ink-dim);
  }

  .ticket {
    position: relative;
    background: var(--gold);
    color: #241d0f;
    border: none;
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 0.92rem;
    padding: 12px 20px;
    border-radius: 6px;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  .ticket:hover { filter: brightness(1.08); }
  .ticket:active { filter: brightness(0.95); }

  @media (max-width: 480px) {
    .house { height: 94vh; border-radius: 0; }
    .marquee { padding: 18px 18px 16px; }
    .marquee h1 { font-size: 1.5rem; }
    .marquee form.reset { top: 18px; right: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="house">
  <div class="marquee">
    <h1>Movie Buddy</h1>
    <p>Recommendations, directors, and film facts on request</p>
    <form class="reset" action="/reset" method="post">
      <button type="submit">Start over</button>
    </form>
  </div>

  <div class="reel">
    <div class="sprockets"></div>
    <div class="frames" id="frames">
      {% for sender, message in chat %}
      <div class="msg {{ sender }}">
        <div class="bubble">{{ message }}</div>
      </div>
      {% endfor %}
    </div>
    <div class="sprockets"></div>
  </div>

  <form class="counter" method="post" action="/" autocomplete="off">
    <input type="text" name="message" placeholder="Ask for a genre, a director, or a movie..." autofocus>
    <button class="ticket" type="submit">Send</button>
  </form>
</div>

<script>
  var frames = document.getElementById('frames');
  frames.scrollTop = frames.scrollHeight;
</script>

</body>
</html>
